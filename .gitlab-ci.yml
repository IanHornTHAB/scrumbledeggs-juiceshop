stages:
  - package
  - test
  - sast
  - sca-package
  - publish
  - sca-container
  - deploy
  - fuzzing
  - dast

package:
  stage: package
  image: node:24
  script:
    - cd app
    - npm install
    - npm run build:frontend
    - npm run build:server
  artifacts:
    paths:
      - build/
      - frontend/dist/
    expire_in: 1 hour

publish-container:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd app
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

npm-audit:
  stage: sca-package
  image: node:24
  script:
    - cd app
    - npm install
    - npm audit

include:
    - template: Security/SAST.gitlab-ci.yml

zap-dast:
  stage: dast
  image: ghcr.io/zaproxy/zaproxy:stable
  services:
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      alias: juice-shop
  script:
    - mkdir -p reports
    - zap-baseline.py -t http://juice-shop:3000 -r reports/zap-report.html || true
  artifacts:
    when: always
    paths:
      - reports/zap-report.html
    expire_in: 1 week