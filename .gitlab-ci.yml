stages:
  - package
  - test
  - sast
  - sca-package
  - publish
  - sca-container
  - deploy
  - fuzzing
  - dast
  - report 

package:
  stage: package
  image: node:24
  script:
    - cd app
    - npm install
    - npm run build:frontend
    - npm run build:server
  artifacts:
    paths:
      - build/
      - frontend/dist/
    expire_in: 1 hour

publish-container:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd app
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

npm-audit:
  stage: sca-package
  image: node:24
  script:
    - cd app
    - npm install
    - npm audit || true

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H VM-IP-ENTFERNT >> ~/.ssh/known_hosts
  script:
    - ssh ubuntu@VM-IP-ENTFERNT "docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - ssh ubuntu@VM-IP-ENTFERNT "docker stop juice-shop || true"
    - ssh ubuntu@VM-IP-ENTFERNT "docker rm juice-shop || true"
    - ssh ubuntu@VM-IP-ENTFERNT "docker run -d --name juice-shop -p 3000:3000 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - feature/pipeline-scan-log

include:
    - template: Security/SAST.gitlab-ci.yml

zap-scan:
  stage: fuzzing
  image: ghcr.io/zaproxy/zaproxy:stable
  script:
    - mkdir -p reports
    - 'zap-baseline.py -t http://juice-shop:3000 -r reports/zap-report.html || true'
  artifacts:
    when: always
    paths:
      - reports/zap-report.html
    expire_in: 1 week

collect-results:
  stage: report
  image: node:24
  dependencies:
    - zap-scan
  when: always
  script:
    - mkdir -p reports
    - node scripts/collect-results.js
  variables:
    REPORTS_DIR: "reports"
  artifacts:
    when: always
    paths:
      - reports/scan-results.json
    expire_in: 12 weeks