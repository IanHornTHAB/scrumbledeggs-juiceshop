stages:
  - package
  - sast
  - sca-package
  - publish
  - test
  - sca-container
  - deploy
  - fuzzing
  - dast-scan
  - report

package:
  stage: package
  image: node:24
  script:
    - cd app
    - npm install
    - npm run build:frontend
    - npm run build:server
  artifacts:
    paths:
      - build/
      - frontend/dist/
    expire_in: 1 hour

sast-semgrep:
  stage: sast
  image: returntocorp/semgrep:stable
  script:
    - semgrep --config=auto --json --output=semgrep-report.json app/ || true
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week

sast-gitleaks:
  stage: sast
  image: 
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --report-format json --report-path gitleaks-report.json || true
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week    

publish-container:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd app
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

unit-test:
  stage: test 
  image: timbru31/node-chrome
  script:
    - cd app
    - npm ci
    - npm test

  artifacts:
    when: always
    paths:
      - app/frontend/src/test-results.json
    expire_in: 1 week

integration-test:
  stage: test
  image: docker:24
  services:
    - name: docker:24-dind
  needs:
    - publish-container
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker stop juice-shop-test || true
    - docker rm juice-shop-test || true
    - docker run -d --name juice-shop-test $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - sleep 60
    - docker logs juice-shop-test
    - docker run --rm --network container:juice-shop-test curlimages/curl:latest -f http://localhost:3000
    - docker stop juice-shop-test
    - docker rm juice-shop-test

npm-audit:
  stage: sca-package
  image: node:24
  script:
    - cd app
    - npm install
    - npm audit || true

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $SSH_IP >> ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$SSH_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh $SSH_USER@$SSH_IP "docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - ssh $SSH_USER@$SSH_IP "docker stop juice-shop || true"
    - ssh $SSH_USER@$SSH_IP "docker rm juice-shop || true"
    - ssh $SSH_USER@$SSH_IP "docker run -d --name juice-shop -p 3000:3000 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

include:
    - template: Security/SAST.gitlab-ci.yml

collect-results:
  stage: report
  image: node:24
  needs:
    - dast-zap
    - sast-gitleaks
  when: always
  script:
    - mkdir -p reports
    - node scripts/collect-results.js
  variables:
    REPORTS_DIR: "reports"
  artifacts:
    when: always
    paths:
      - reports/scan-results.json
    expire_in: 12 weeks

dast-zap:
  stage: dast-scan
  image: ghcr.io/zaproxy/zaproxy:stable
  needs:
    - deploy
  variables:
    GIT_STRATEGY: none
  script:
    - sleep 60
    - mkdir -p /zap/wrk
    - zap-full-scan.py -t http://$SSH_IP:3000 -r zap-report.html -a || true
    - mkdir -p $CI_PROJECT_DIR/reports
    - cp /zap/wrk/zap-report.html $CI_PROJECT_DIR/reports/zap-report.html
  artifacts:
    when: always
    paths:
      - reports/zap-report.html
    expire_in: 1 week
  timeout: 30 minutes
  allow_failure: false


fuzzing:
  stage: fuzzing
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl wget jq bash    
    - wget -q https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz
    - tar -xzf ffuf_2.1.0_linux_amd64.tar.gz
    - mv ffuf /usr/local/bin/ffuf
    - chmod +x /usr/local/bin/ffuf
    - mkdir -p reports/fuzzing
    
    - |
      echo "Warte auf Juice Shop..."

      for i in $(seq 1 30); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$SSH_IP:3000 || true)

        if [ "$STATUS" = "200" ]; then
          echo "Juice Shop erreichbar"
          break
        fi

        echo "Noch nicht erreichbar..."
        sleep 5
      done
    
    - |
      RESPONSE=$(curl -s -X POST http://$SSH_IP:3000/rest/user/login \
        -H "Content-Type: application/json" \
        -d "{\"email\":\"$JUICESHOP_ADMIN_EMAIL\",\"password\":\"$JUICESHOP_ADMIN_PASSWORD\"}")
  
      echo "Login Response: $RESPONSE"

      TOKEN=$(echo "$RESPONSE" | jq -r '.authentication.token // empty')

      if [ -z "$TOKEN" ]; then
        echo "FEHLER: Kein Token erhalten. Response war: $RESPONSE"
        exit 1
      fi

      echo "TOKEN=$TOKEN" > fuzzing.env
    
    - |
      cat > /tmp/api-endpoints.txt << 'EOF'
      rest/user/login
      rest/user/whoami
      rest/products/search
      rest/basket
      api/Users
      api/Products
      EOF
    
    - |
      cat > /tmp/payloads.txt << 'EOF'
      ' OR 1=1--
      <script>alert(1)</script>
      ../../../etc/passwd
      %00
      EOF
  script:
    - source fuzzing.env
    - |
      ffuf \
        -u http://$SSH_IP:3000/FUZZ \
        -w /tmp/api-endpoints.txt \
        -mc all \
        -fc 404 \
        -t 2 \
        -timeout 15 \
        -rate 20 \
        -o reports/fuzzing/endpoints.json \
        -of json || true
    
    - |
      ffuf \
        -u http://$SSH_IP:3000/rest/user/login \
        -X POST \
        -H "Content-Type: application/json" \
        -d '{"email":"FUZZ","password":"test"}' \
        -w /tmp/payloads.txt \
        -mc all \
        -fc 404 \
        -t 2 \
        -timeout 15 \
        -rate 10 \
        -o reports/fuzzing/login-fuzz.json \
        -of json || true
    
    - |
      ffuf \
        -u "http://$SSH_IP:3000/rest/products/search?q=FUZZ" \
        -H "Authorization: Bearer $TOKEN" \
        -w /tmp/payloads.txt \
        -mc all \
        -fc 404 \
        -t 2 \
        -timeout 15 \
        -rate 10 \
        -o reports/fuzzing/search-fuzz.json \
        -of json || true
    
    - |
      echo "Prüfe Reports auf HTTP 500"
      for report in reports/fuzzing/*.json; do
        COUNT=$(jq '[.results[] | select(.status == 500)] | length' "$report")

        if [ "$COUNT" -gt 0 ]; then
          echo "WARNUNG: $COUNT x HTTP 500 in $report"
        fi
      done
  artifacts:
    when: always
    paths:
      - reports/fuzzing/
    expire_in: 1 week
  rules:
    - when: always

sca-container:
  stage: sca-container
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - publish-container
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apk add --no-cache jq
  script:
    - mkdir -p reports
    - trivy image
        --format json
        --output reports/trivy-report.json
        --severity LOW,MEDIUM,HIGH,CRITICAL
        --ignorefile .trivyignore
        --username $CI_REGISTRY_USER
        --password $CI_REGISTRY_PASSWORD
        $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - |
      CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' reports/trivy-report.json)
      echo "Gefundene CRITICAL Findings: $CRITICAL_COUNT"
      if [ "$CRITICAL_COUNT" -gt 0 ]; then
        echo "WARNUNG: $CRITICAL_COUNT kritische Schwachstellen gefunden (JuiceShop ist by-design verwundbar)."
        exit 1
      fi
  allow_failure:
    exit_codes:
      - 1
  artifacts:
    when: always
    paths:
      - reports/trivy-report.json
    expire_in: 1 week

sca-container:
  stage: sca-container
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - publish-container
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - apk add --no-cache jq
  script:
    - mkdir -p reports
    - trivy image
        --format json
        --output reports/trivy-report.json
        --severity LOW,MEDIUM,HIGH,CRITICAL
        --ignorefile .trivyignore
        --username $CI_REGISTRY_USER
        --password $CI_REGISTRY_PASSWORD
        $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - |
      CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' reports/trivy-report.json)
      echo "Gefundene CRITICAL Findings: $CRITICAL_COUNT"
      if [ "$CRITICAL_COUNT" -gt 0 ]; then
        echo "WARNUNG: $CRITICAL_COUNT kritische Schwachstellen gefunden (JuiceShop ist by-design verwundbar)."
        exit 1
      fi
  allow_failure:
    exit_codes:
      - 1
  artifacts:
    when: always
    paths:
      - reports/trivy-report.json
    expire_in: 1 week


send-to-dashboard:
  stage: report
  image: alpine:3.20
  needs:
    - job: collect-results
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      jq -n \
        --arg sha "$CI_COMMIT_SHA" \
        --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --slurpfile findings scan-results.json \
        '{commit_sha: $sha, timestamp: $ts, findings: $findings[0]}' > payload.json
    - |
      status=$(curl -s -o response.json -w "%{http_code}" \
        -X POST "$DASHBOARD_URL/api/scan-results" \
        -H "Authorization: Bearer $DASHBOARD_TOKEN" \
        -H "Content-Type: application/json" \
        --data @payload.json)
      echo "HTTP-Status: $status"
      cat response.json
      if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
        echo "Dashboard-Ingest fehlgeschlagen (Status $status)"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - payload.json
      - response.json
    expire_in: 1 week