stages:
  - package
  - sast
  - sca-package
  - publish
  - test
  - sca-container
  - deploy
  - fuzzing
  - dast-scan
  - report

package:
  stage: package
  image: node:24
  script:
    - cd app
    - npm install
    - npm run build:frontend
    - npm run build:server
  artifacts:
    paths:
      - build/
      - frontend/dist/
    expire_in: 1 hour

sast-semgrep:
  stage: sast
  image: returntocorp/semgrep:stable
  script:
    - mkdir -p reports
    - semgrep --config=gibt-es-nicht --json --output=reports/findings-semgrep.json app/ || true
    - |
      if [ ! -s reports/findings-semgrep.json ]; then
        echo "Semgrep report missing. Creating fallback JSON."
        printf '%s\n' \
          '{' \
          '  "tool_name": "semgrep",' \
          '  "scan_type": "sast",' \
          '  "findings": []' \
          '}' > reports/findings-semgrep.json
      fi
    - cat reports/findings-semgrep.json
  
  artifacts:
    when: always
    paths:
      - reports/findings-semgrep.json
    expire_in: 1 week

sast-gitleaks:
  stage: sast
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - mkdir -p reports
    - gitleaks detect --report-format json --report-path reports/findings-gitleaks.json || true
    - |
      if [ ! -s reports/findings-gitleaks.json ]; then
        echo "Gitleaks report missing. Creating fallback JSON."
        cat > reports/findings-gitleaks.json <<EOF
      {
        "tool_name": "gitleaks",
        "scan_type": "secret_detection",
        "findings": []
      }
      EOF
      fi
  artifacts:
    when: always
    paths:
      - reports/findings-gitleaks.json
    expire_in: 1 week

publish-container:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd app
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

unit-test:
  stage: test 
  image: timbru31/node-chrome
  script:
    - cd app
    - npm ci
    - npm test

  artifacts:
    when: always
    paths:
      - app/frontend/src/test-results.json
    expire_in: 1 week

integration-test:
  stage: test
  image: docker:24
  services:
    - name: docker:24-dind
  needs:
    - publish-container
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker stop juice-shop-test || true
    - docker rm juice-shop-test || true
    - docker run -d --name juice-shop-test $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - sleep 60
    - docker logs juice-shop-test
    - docker run --rm --network container:juice-shop-test curlimages/curl:latest -f http://localhost:3000
    - docker stop juice-shop-test
    - docker rm juice-shop-test

npm-audit:
  stage: sca-package
  image: node:24
  script:
    - cd app
    - npm install
    - npm audit || true

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $SSH_IP >> ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$SSH_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh $SSH_USER@$SSH_IP "docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - ssh $SSH_USER@$SSH_IP "docker stop juice-shop || true"
    - ssh $SSH_USER@$SSH_IP "docker rm juice-shop || true"
    - ssh $SSH_USER@$SSH_IP "docker run -d --name juice-shop -p 3000:3000 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

include:
    - template: Security/SAST.gitlab-ci.yml

collect-results:
  stage: report
  image: node:24
  needs:
    - dast-zap
    - sast-gitleaks
  when: always
  script:
    - mkdir -p reports
    - node scripts/collect-results.js
  variables:
    REPORTS_DIR: "reports"
  artifacts:
    when: always
    paths:
      - reports/scan-results.json
    expire_in: 12 weeks

dast-zap:
  stage: dast-scan
  image: ghcr.io/zaproxy/zaproxy:stable
  needs:
    - deploy
  variables:
    GIT_STRATEGY: none
  script:
    - sleep 60
    - mkdir -p /zap/wrk
    - zap-full-scan.py -t http://$SSH_IP:3000 -r zap-report.html -J zap-report.json -a || true
    - mkdir -p $CI_PROJECT_DIR/reports
    - cp /zap/wrk/zap-report.html $CI_PROJECT_DIR/reports/zap-report.html
    - cp /zap/wrk/zap-report.json $CI_PROJECT_DIR/reports/zap-report.json
  artifacts:
    when: always
    paths:
      - reports/zap-report.html
      - reports/zap-report.json
    expire_in: 1 week
  timeout: 30 minutes
  allow_failure: false


fuzzing:
  stage: fuzzing
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl wget jq bash    
    - wget -q https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz
    - tar -xzf ffuf_2.1.0_linux_amd64.tar.gz
    - mv ffuf /usr/local/bin/ffuf
    - chmod +x /usr/local/bin/ffuf
    - mkdir -p reports/fuzzing
    
    - |
      echo "Warte auf Juice Shop..."

      for i in $(seq 1 30); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$SSH_IP:3000 || true)

        if [ "$STATUS" = "200" ]; then
          echo "Juice Shop erreichbar"
          break
        fi

        echo "Noch nicht erreichbar..."
        sleep 5
      done
    
    - |
      RESPONSE=$(curl -s -X POST http://$SSH_IP:3000/rest/user/login \
        -H "Content-Type: application/json" \
        -d "{\"email\":\"$JUICESHOP_ADMIN_EMAIL\",\"password\":\"$JUICESHOP_ADMIN_PASSWORD\"}")
  
      echo "Login Response: $RESPONSE"

      TOKEN=$(echo "$RESPONSE" | jq -r '.authentication.token // empty')

      if [ -z "$TOKEN" ]; then
        echo "FEHLER: Kein Token erhalten. Response war: $RESPONSE"
        exit 1
      fi

      echo "TOKEN=$TOKEN" > fuzzing.env
    
    - |
      cat > /tmp/api-endpoints.txt << 'EOF'
      rest/user/login
      rest/user/whoami
      rest/products/search
      rest/basket
      api/Users
      api/Products
      EOF
    
    - |
      cat > /tmp/payloads.txt << 'EOF'
      ' OR 1=1--
      <script>alert(1)</script>
      ../../../etc/passwd
      %00
      EOF
  script:
    - source fuzzing.env
    - |
      ffuf \
        -u http://$SSH_IP:3000/FUZZ \
        -w /tmp/api-endpoints.txt \
        -mc all \
        -fc 404 \
        -t 2 \
        -timeout 15 \
        -rate 20 \
        -o reports/fuzzing/endpoints.json \
        -of json || true
    
    - |
      ffuf \
        -u http://$SSH_IP:3000/rest/user/login \
        -X POST \
        -H "Content-Type: application/json" \
        -d '{"email":"FUZZ","password":"test"}' \
        -w /tmp/payloads.txt \
        -mc all \
        -fc 404 \
        -t 2 \
        -timeout 15 \
        -rate 10 \
        -o reports/fuzzing/login-fuzz.json \
        -of json || true
    
    - |
      ffuf \
        -u "http://$SSH_IP:3000/rest/products/search?q=FUZZ" \
        -H "Authorization: Bearer $TOKEN" \
        -w /tmp/payloads.txt \
        -mc all \
        -fc 404 \
        -t 2 \
        -timeout 15 \
        -rate 10 \
        -o reports/fuzzing/search-fuzz.json \
        -of json || true
    
    - |
      echo "Prüfe Reports auf HTTP 500"
      for report in reports/fuzzing/*.json; do
        COUNT=$(jq '[.results[] | select(.status == 500)] | length' "$report")

        if [ "$COUNT" -gt 0 ]; then
          echo "WARNUNG: $COUNT x HTTP 500 in $report"
        fi
      done
  artifacts:
    when: always
    paths:
      - reports/fuzzing/
    expire_in: 1 week
  rules:
    - when: always
